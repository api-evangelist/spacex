naftiko: 1.0.0-alpha2
info:
  label: SpaceX REST API — Fleet & Pads
  description: 'SpaceX physical infrastructure capability. List launchpads, landing pads / droneships, and recovery / support ships. Lead operation: List launchpads.'
  tags:
    - SpaceX
    - Launchpads
    - Landpads
    - Ships
    - Droneships
  created: '2026-05-29'
  modified: '2026-05-29'
binds: []
capability:
  consumes:
    - type: http
      namespace: spacex-fleet
      baseUri: https://api.spacexdata.com
      description: SpaceX physical infrastructure capability.
      resources:
        - name: launchpads
          path: /v4/launchpads
          operations:
            - name: listLaunchpads
              method: GET
              description: List all launchpads.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
        - name: landpads
          path: /v4/landpads
          operations:
            - name: listLandpads
              method: GET
              description: List all landing pads and droneships.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
        - name: ships
          path: /v4/ships
          operations:
            - name: listShips
              method: GET
              description: List all ships in the SpaceX fleet.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
        - name: cores
          path: /v4/cores
          operations:
            - name: listCores
              method: GET
              description: List all serialized first-stage cores.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
  exposes:
    - type: mcp
      namespace: spacex-fleet-mcp
      port: 9090
      transport: http
      description: MCP adapter for SpaceX fleet & pads.
      tools:
        - name: list-launchpads
          description: List all SpaceX launchpads.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-fleet.listLaunchpads
          outputParameters:
            - type: array
              mapping: $.
        - name: list-landpads
          description: List all SpaceX landing pads and droneships.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-fleet.listLandpads
          outputParameters:
            - type: array
              mapping: $.
        - name: list-ships
          description: List all ships in the SpaceX fleet.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-fleet.listShips
          outputParameters:
            - type: array
              mapping: $.
        - name: list-cores
          description: List all serialized first-stage cores.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-fleet.listCores
          outputParameters:
            - type: array
              mapping: $.
