naftiko: 1.0.0-alpha2
info:
  label: SpaceX REST API — Crew & Dragon
  description: 'SpaceX human-spaceflight capability. List Dragon capsule versions, serialized capsule fleet, and crew members assigned to missions. Lead operation: List crew.'
  tags:
    - SpaceX
    - Crew
    - Dragon
    - Capsules
  created: '2026-05-29'
  modified: '2026-05-29'
binds: []
capability:
  consumes:
    - type: http
      namespace: spacex-crew
      baseUri: https://api.spacexdata.com
      description: SpaceX human-spaceflight capability — crew, dragons, capsules.
      resources:
        - name: crew
          path: /v4/crew
          operations:
            - name: listCrew
              method: GET
              description: List all SpaceX Dragon crew members.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
        - name: crew-id
          path: /v4/crew/{id}
          operations:
            - name: getCrewMember
              method: GET
              description: Get one crew member by ID.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: dragons
          path: /v4/dragons
          operations:
            - name: listDragons
              method: GET
              description: List all Dragon capsule versions.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
        - name: capsules
          path: /v4/capsules
          operations:
            - name: listCapsules
              method: GET
              description: List all serialized Dragon capsules.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: $.
  exposes:
    - type: mcp
      namespace: spacex-crew-mcp
      port: 9090
      transport: http
      description: MCP adapter for SpaceX crew + Dragon.
      tools:
        - name: list-crew
          description: List all SpaceX Dragon crew members.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-crew.listCrew
          outputParameters:
            - type: array
              mapping: $.
        - name: get-crew-member
          description: Get a single crew member by ID.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-crew.getCrewMember
          with: { id: tools.id }
          outputParameters:
            - type: object
              mapping: $.
        - name: list-dragons
          description: List all Dragon capsule versions.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-crew.listDragons
          outputParameters:
            - type: array
              mapping: $.
        - name: list-capsules
          description: List all serialized Dragon capsules.
          hints: { readOnly: true, destructive: false, idempotent: true }
          call: spacex-crew.listCapsules
          outputParameters:
            - type: array
              mapping: $.
