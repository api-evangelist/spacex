aid: spacex
name: SpaceX (Community API)
description: >-
  Community-maintained, open-source REST and GraphQL API for SpaceX data — launches, rockets, capsules, cores, crew,
  dragons, payloads, ships, landpads, launchpads, Starlink satellites, the Tesla Roadster ephemeris, company info, and
  historical events. Operated by the r-spacex community (the same group behind the r/SpaceX subreddit) and licensed
  Apache 2.0. The canonical hosted base URL is https://api.spacexdata.com and the canonical source repository is
  https://github.com/r-spacex/SpaceX-API.

  The API is currently in MAINTENANCE-ONLY MODE as of 2024. New launches and missions are NOT being added to the
  dataset; the project remains online for historical lookups and as a teaching/sample API. This makes it an excellent
  fixture for SDK tutorials, MCP server demos, and API design exercises, but it is no longer a live source of upcoming
  SpaceX flight data.

  The data is organized as a MongoDB document store with cross-resource UUID references; the /query endpoints expose
  mongoose-paginate-v2 with full MongoDB find()/options semantics. Authentication is only required for destructive
  (create/update/delete) admin routes; all read operations are public. This community project is not affiliated with,
  endorsed by, or officially connected to Space Exploration Technologies Corp.
type: Index
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Provider
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/spacex.png
x-status: maintenance-only
x-status-note: >-
  As of 2024 the r-spacex/SpaceX-API project is in maintenance-only mode. New launches, payloads, crew, and starlink
  records are NOT being added; existing data remains queryable and historical only.
tags:
- Space
- Launch
- Satellites
- Starlink
- Falcon 9
- Falcon Heavy
- Dragon
- Rockets
- Open Source
- Community
- REST
- GraphQL
- Open Data
apis:
- aid: spacex:graphql-api
  name: SpaceX GraphQL API (community)
  description: >-
    Community-maintained GraphQL gateways over the SpaceX REST data, providing typed schema access and
    nested-field selection across launches, rockets, missions, payloads, ships, and crew. Multiple community
    gateways exist; the SpaceXLand/api project is the most widely cited reference implementation. Like
    the REST surface, the underlying dataset is in maintenance-only mode as of 2024.
  humanURL: https://github.com/SpaceXLand/api
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
