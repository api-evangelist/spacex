aid: spacex
name: SpaceX
description: >-
  SpaceX is the launch and space transportation company founded by Elon Musk
  that operates the partially-reusable Falcon 9 and Falcon Heavy rockets, the
  fully-reusable Starship super-heavy lift vehicle, and the Dragon crew and
  cargo spacecraft for ISS and commercial missions. SpaceX also operates
  Starlink, the world's largest low-earth-orbit satellite internet
  constellation, serving consumers, enterprises, maritime, aviation, and
  governments. Neither SpaceX launch services nor Starlink expose a public
  developer REST API at this time. Programmatic access to a Starlink user
  terminal is possible through an unauthenticated local gRPC service on the
  dish at 192.168.100.1:9200, whose protobuf definitions have been
  reverse-engineered by the community (notably the starlink-grpc-tools
  project) and are used for monitoring throughput, latency, obstructions,
  reboot, and stow.
