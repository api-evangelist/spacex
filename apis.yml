- aid: spacex:graphql-api
  name: SpaceX GraphQL API (community)
  description: >-
    Community-maintained GraphQL gateways over the SpaceX REST data, providing typed schema access and nested-field
    selection across launches, rockets, missions, payloads, ships, and crew. Multiple community gateways exist; the
    SpaceXLand/api project is the most widely cited reference implementation. Like the REST surface, the underlying
    dataset is in maintenance-only mode as of 2024.
  humanURL: https://github.com/SpaceXLand/api
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
